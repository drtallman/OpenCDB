[package]
name = "cdb-lint"
version = "0.1.0"
edition = "2024"
description = "Command-line conformance checker for OGC CDB 2.0 Core datastores"
license = "Apache-2.0"
repository = "https://github.com/drtallman/OpenCDB"
keywords = ["ogc", "cdb", "geospatial", "conformance", "lint"]
categories = ["command-line-utilities", "science::geo"]

[features]
default = []
gpkg-metadata = ["opencdb/gpkg-metadata"]

# The original CLI reused the library's dependencies (design §2, decision 5).
# GeoPackage support is an explicit optional addition forwarded to opencdb;
# the default linter still adds no SQLite dependency.
# `serde_json` renders the `--format json` artifact and parses a baseline;
# the version pins match the library's so nothing re-resolves.
[dependencies]
opencdb = { path = "..", version = "1.0.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }

[dev-dependencies]
# The integration tests build real datastores rather than mocking reports:
# the honesty rules of design §5 are claims about what a datastore makes the
# library say, and a mock could be made to say anything.
tempfile = "3.27.0"

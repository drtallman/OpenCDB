[package]
name = "rusty_cdb"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
geo = "0.33.1"
geo-types = "0.7.19"
geojson = "1.0.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
wkt = "0.14.0"

[dev-dependencies]
approx = "0.5.1"
tempfile = "3.27.0"

[workspace]
members = ["cdb-lint"]

[package]
name = "opencdb"
version = "1.0.0"
edition = "2024"
description = "Read, write, and validate OGC CDB 2.0 Core datastores"
license = "Apache-2.0"
repository = "https://github.com/drtallman/OpenCDB"
keywords = ["ogc", "cdb", "geospatial", "conformance", "gis"]
categories = ["science::geo"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
geo = "0.33.1"
geo-types = { version = "0.7.19", features = ["serde"] }
geojson = "1.0.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
thiserror = "2.0.18"
wkt = "0.14.0"

[dev-dependencies]
approx = "0.5.1"
tempfile = "3.27.0"
